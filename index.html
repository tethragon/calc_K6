<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator K6</title>
    <meta name="description" content="Scientific & Educational Calculator with vertical arithmetic algorithms and linear algebra." />
    <meta property="og:title" content="Calculator K6" />
    <meta property="og:description" content="Scientific & Educational Calculator with vertical arithmetic algorithms and linear algebra." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathquill/0.10.1/mathquill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-body: #f0f4f8;
            --bg-calc: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            --input-bg: #ffffff;
            --input-border: #0056b3;
            --btn-base-bg: #eef2f5;
            --btn-base-text: #333333;
            --btn-base-hover: #dbe2e8;
            --btn-op-bg: #e0ebff;
            --btn-op-text: #0056b3;
            --btn-theory-bg: #f3e5f5;
            --btn-theory-text: #7b1fa2;
            --btn-alg-bg: #fff3e0;
            --btn-alg-text: #e65100;
            --btn-clear-bg: #ffecec;
            --btn-clear-text: #d32f2f;
            --btn-ans-bg: #e8f5e9;
            --btn-ans-text: #2e7d32;
            --btn-action-bg: #0056b3;
            --btn-action-text: #ffffff;
            --btn-action-hover: #004494;
            --result-bg: #fafafa;
            --line-color: #333333; 
            --quotient-color: #2e7d32;
            --highlight-color: #0056b3;
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --modal-bg: #ffffff;
            --banner-bg: #fff8e1;
            --banner-border: #ffb300;
            --banner-text: #795548;
            --card-bg: #f5f8fa;
            --card-border: #e1e8ed;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-calc: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #444444;
            --input-bg: #2d2d2d;
            --input-border: #64b5f6;
            --btn-base-bg: #333333;
            --btn-base-text: #e0e0e0;
            --btn-base-hover: #444444;
            --btn-op-bg: #1a237e;
            --btn-op-text: #8c9eff;
            --btn-theory-bg: #4a148c;
            --btn-theory-text: #ea80fc;
            --btn-alg-bg: #3e2723;
            --btn-alg-text: #ffcc80;
            --btn-clear-bg: #b71c1c;
            --btn-clear-text: #ffcdd2;
            --btn-ans-bg: #1b5e20;
            --btn-ans-text: #a5d6a7;
            --btn-action-bg: #1565c0;
            --btn-action-text: #ffffff;
            --btn-action-hover: #0d47a1;
            --result-bg: #262626;
            --line-color: #dddddd; 
            --quotient-color: #66bb6a;
            --highlight-color: #64b5f6;
            --modal-overlay: rgba(0, 0, 0, 0.7);
            --modal-bg: #2d2d2d;
            --banner-bg: #2e2612;
            --banner-border: #ffb300;
            --banner-text: #ffe082;
            --card-bg: #2a2a2a;
            --card-border: #3d3d3d;
        }

        * { box-sizing: border-box; }
        
        html, body {
            overflow-x: hidden;
            width: 100%;
            touch-action: pan-y; 
            position: relative;
        }

        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
            transition: background-color 0.3s;
        }
        
        .calculator { 
            background: var(--bg-calc); 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 95%; max-width: 600px;
            cursor: text; 
            position: relative;
            transition: background-color 0.3s;
        }

        .settings-toggle {
            position: absolute;
            top: 20px; right: 20px;
            background: none; border: none;
            font-size: 24px; cursor: pointer;
            color: var(--text-main);
            padding: 0;
            z-index: 10;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.3s;
        }
        .settings-toggle:hover { opacity: 1; transform: rotate(90deg); }

        h3 { 
            text-align: center; 
            color: var(--text-main); 
            margin-top: 0; 
            margin-bottom: 20px; 
            letter-spacing: 0.5px;
        }

        #math-input { 
            width: 100%; font-size: 26px; padding: 10px; 
            border: 2px solid var(--input-border); 
            border-radius: 10px; margin-bottom: 5px; 
            background: var(--input-bg); 
            color: var(--text-main);
            min-height: 60px; display: flex; align-items: center; 
            position: relative; z-index: 1;
        }
        .mq-math-mode { color: var(--text-main); }
        .mq-root-block { color: var(--text-main); }
        
        .history-hint { 
            font-size: 11px; 
            color: var(--text-muted); 
            text-align: right; 
            margin-bottom: 15px; 
            font-style: italic; 
            cursor: default;
        }

        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; z-index: 1;}
        
        button {
            padding: 12px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
            background-color: var(--btn-base-bg); color: var(--btn-base-text); font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover { background-color: var(--btn-base-hover); }
        button:active { transform: scale(0.96); }
        
        button.operator { background-color: var(--btn-op-bg); color: var(--btn-op-text); }
        button.theory { background-color: var(--btn-theory-bg); color: var(--btn-theory-text); font-size: 14px; text-transform: uppercase; }
        button.algebra { background-color: var(--btn-alg-bg); color: var(--btn-alg-text); font-size: 18px; font-style: italic; font-family: 'Times New Roman', serif; }
        
        button.action { 
            background-color: var(--btn-action-bg); 
            color: var(--btn-action-text); 
            font-size: 18px;
            font-weight: 900;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: 1px;
        }

        button.action:hover { 
            background-color: var(--btn-action-hover); 
        }
        button.clear { background-color: var(--btn-clear-bg); color: var(--btn-clear-text); }
        button.ans { background-color: var(--btn-ans-bg); color: var(--btn-ans-text); font-weight: 900; }

        .results-area { 
            margin-top: 20px; padding: 15px; 
            border-top: 2px dashed var(--border-color); 
            background: var(--result-bg); 
            border-radius: 8px; min-height: 100px; 
            display: none; cursor: default; 
            color: var(--text-main);
            position: relative; z-index: 1;
            overflow-x: auto; 
        }
        
        .theory-title { 
            font-size: 16px; color: var(--text-muted); 
            margin-bottom: 12px; text-transform: uppercase; 
            font-weight: bold; text-align: center; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 6px; 
        }
        
        /* --- MODAL STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-overlay);
            display: none; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        
        .modal-content {
            background-color: var(--modal-bg);
            color: var(--text-main);
            width: 90%; max-width: 420px;
            padding: 25px; border-radius: 15px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            text-align: center;
            transform: scale(0.9); transition: transform 0.3s;
            border: 1px solid var(--border-color);
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .modal-version { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
        
        .modal-btn-row { margin: 15px 0; }
        .modal-theme-btn {
            width: 100%; padding: 12px; background: var(--btn-base-bg);
            color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 16px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .modal-theme-btn:hover { background: var(--btn-base-hover); }

        .modal-credit {
            margin-top: 25px; margin-bottom: 25px;
            padding-top: 15px; border-top: 1px solid var(--border-color);
        }
        .credit-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .credit-name { font-size: 14px; font-weight: bold; color: var(--highlight-color); margin-top: 5px; font-family: 'Segoe UI', sans-serif;}

        .modal-close {
            background: var(--btn-action-bg); color: white;
            padding: 10px 30px; border-radius: 20px; font-size: 16px; border: none;
            cursor: pointer; width: 100%;
        }
        .modal-close:hover { background: var(--btn-action-hover); }

        /* --- LONG DIVISION & VMUL Styles --- */
        .long-div-container { 
            display: flex; justify-content: center; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 24px; color: var(--text-main); 
            line-height: 1.5; letter-spacing: 1px; 
            margin: 15px 0;
        }
        .ld-left-col { display: flex; flex-direction: column; align-items: flex-start; margin-right: 15px; position: relative; }
        .ld-grid-row { display: flex; position: relative; height: 1.5em; align-items: center; margin-bottom: 2px; }
        .ld-cell { width: 1.5ch; text-align: center; position: relative; height: 1.5em; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
        .ld-cell .ghost-comma { position: absolute; bottom: 2px; right: -0.35ch; font-weight: bold; color: inherit; pointer-events: none; line-height: 1; }
        .ld-subtrahend-cell { border-bottom: 2px solid var(--line-color); }
        .ld-row { white-space: pre; position: relative; margin-bottom: 2px; } 
        .ld-minus { position: absolute; left: -14px; font-weight: bold; color: var(--text-main); }
        .ld-subtrahend { border-bottom: 2px solid var(--line-color); display: inline-block; padding-bottom: 2px; margin-bottom: 3px; }
        .ld-right-col { border-left: 3px solid var(--line-color); padding-left: 12px; display: flex; flex-direction: column; }
        .ld-divisor { border-bottom: 3px solid var(--line-color); padding-bottom: 5px; margin-bottom: 5px; font-weight: bold; }
        .ld-quotient { color: var(--quotient-color); font-weight: bold; font-size: 28px; }
        .ld-q-container { display: inline-flex; align-items: center; letter-spacing: 0; }
        .ld-q-cell { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 1.3ch; text-align: center; }
        .ld-q-cell .ghost-comma { position: absolute; bottom: 2px; right: -0.35ch; font-weight: bold; color: inherit; pointer-events: none; line-height: 1; }

        /* --- ACTION BAR & PRINTABLE CARD & TOAST --- */
        .calc-action-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .btn-copy-img {
            background: var(--btn-base-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
            font-family: 'Segoe UI', sans-serif;
        }
        .btn-copy-img:hover {
            background: var(--btn-op-bg);
            border-color: var(--highlight-color);
            color: var(--highlight-color);
            transform: translateY(-1px);
        }
        .btn-copy-img:active {
            transform: scale(0.96);
        }
        .btn-copy-img.btn-copy-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #a5d6a7;
        }
        .printable-calc-card {
            background: var(--bg-calc);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin: 8px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
            position: relative;
        }
        .toast-notice {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: #323232;
            color: #ffffff;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            z-index: 99999;
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.3s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast-notice.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* --- DECIMAL DIVISION ENHANCEMENTS --- */
        .shift-banner {
            background-color: var(--banner-bg);
            border: 1px solid var(--banner-border);
            color: var(--banner-text);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: left;
            line-height: 1.4;
        }
        .shift-title {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            font-size: 15px;
        }
        .shift-formula {
            margin-top: 8px;
            padding: 6px 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .shift-arrow { color: #f57c00; font-size: 18px; }
        .shift-highlight { color: var(--highlight-color); }

        .identity-line {
            text-align: center;
            font-size: 22px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .badge {
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: normal;
            vertical-align: middle;
        }
        .badge-exact { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .badge-approx { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }

        /* Pedagogical Accordion */
        .pedagogical-container {
            margin-top: 18px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .pedagogical-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pedagogical-toggle:hover { background: var(--btn-base-hover); }
        .pedagogical-content {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .ped-step-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            line-height: 1.45;
        }
        .ped-step-badge {
            display: inline-block;
            background: var(--btn-op-bg);
            color: var(--btn-op-text);
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .ped-step-item { margin: 4px 0; }
        .ped-step-detail {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px dashed var(--border-color);
            color: var(--text-muted);
            font-size: 12px;
        }


        .vmul-grid { display: grid; justify-content: center; font-family: 'Consolas', 'Courier New', monospace; font-size: 24px; color: var(--text-main); column-gap: 0.1ch; row-gap: 2px; width: fit-content; margin: 0 auto; }
        .grid-cell { width: 1.5ch; text-align: center; position: relative; height: 1.5em; display: flex; align-items: center; justify-content: center; }
        .grid-border { grid-column: 1 / -1; border-bottom: 3px solid var(--line-color); height: 5px; margin-bottom: 5px; }
        .grid-operator { font-weight: bold; color: var(--text-main); }
        .ghost-comma, .ghost-dot { position: absolute; bottom: 3px; right: -0.4ch; font-weight: bold; color: inherit; pointer-events: none; line-height: 1; }
        .result-cell { color: var(--highlight-color); font-weight: bold; }
        .partial-cell { color: var(--text-muted); }

        .std-result-row { display: grid; grid-template-columns: 80px 40px 1fr; align-items: center; margin-bottom: 10px; font-size: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; font-family: 'Segoe UI', sans-serif; letter-spacing: normal; }
        .label { color: var(--text-muted); font-size: 16px; }
        .prefix { color: var(--text-main); font-weight: bold; font-style: italic; font-family: 'Times New Roman', serif; text-align: right; padding-right: 5px;}
        .value { font-weight: bold; font-size: 22px; color: var(--highlight-color); }
        .fraction-render { display: inline-block; vertical-align: middle; text-align: center; font-size: 0.8em; margin: 0 2px; }
        .frac-top { border-bottom: 2px solid currentColor; display: block; padding: 0 2px; }
        .frac-bottom { display: block; padding: 0 2px; }
        .divisors-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
        .divisor-tag { background: #7b1fa2; color: white; padding: 4px 10px; border-radius: 12px; font-size: 16px; }
        .simp-info { margin-top: 5px; font-size: 14px; color: var(--quotient-color); font-style: italic; text-align: right; grid-column: 3; }

        button.theory { position: relative; }
        button.theory::after { content: attr(data-tooltip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background-color: var(--bg-calc); color: var(--text-main); padding: 6px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; opacity: 0; visibility: hidden; transition: opacity 0.2s, visibility 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); border: 1px solid var(--border-color); z-index: 100; pointer-events: none; font-weight: normal; text-transform: none; letter-spacing: normal; text-align: center; }
        button.theory:hover::after { opacity: 1; visibility: visible; bottom: 120%; }

        /* Responsive Fixes */
        @media (max-width: 600px) {
            body {
                align-items: flex-start; 
                padding-top: 20px;       
                padding-bottom: 40vh;
            }
            .calculator { padding: 15px; }
            button { padding: 10px 0; font-size: 16px; }
            .keypad { gap: 5px; }
            button.theory { font-size: 11px; }
            #math-input { font-size: 22px; min-height: 50px; }
            .long-div-container, .vmul-grid { font-size: 20px; }
            .ld-quotient { font-size: 24px; }
            .std-result-row { grid-template-columns: 70px 30px 1fr; font-size: 16px; }
            .value { font-size: 20px; }
            button.theory::after { font-size: 10px; padding: 4px 6px; bottom: 110%; white-space: normal; width: 120px; }
            button.theory:hover::after { bottom: 115%; }
        }
    </style>
</head>
<body>

<div class="calculator" id="calc-body">
    <button class="settings-toggle" onclick="openSettings()" title="Ρυθμίσεις & Πληροφορίες">⚙️</button>
    
    <h3>Calculator K6</h3>
    
    <div id="math-input"></div>
    
    <div class="history-hint">History: PageUp / PageDown</div>

    <div class="keypad">
        <button class="theory" onclick="insertTheory('D-DIV')" data-tooltip="Δεκαδική Κάθετη Διαίρεση. Παράδειγμα: D-DIV(14;4) ή D-DIV(12,5;0,4)">D-DIV</button>
        <div></div> <div></div> <div></div>
        <button class="theory" onclick="insertTheory('DIVs')" data-tooltip="Όλοι οι Διαιρέτες. Παράδειγμα: DIVs(12)">DIVs</button>

        <button class="theory" onclick="insertTheory('E-DIV')" data-tooltip="Ευκλείδεια Διαίρεση (ακέραιη). Παράδειγμα: E-DIV(245;7)">E-DIV</button>
        <button class="theory" onclick="insertTheory('V-MUL')" data-tooltip="Κάθετος Πολλαπλασιασμός. Παράδειγμα: V-MUL(12,5;8)">V-MUL</button>
        <button class="theory" onclick="insertTheory('LCM')" data-tooltip="Ελάχιστο Κοινό Πολλαπλάσιο (ΕΚΠ). Παράδειγμα: LCM(12;18)">LCM</button>
        <button class="theory" onclick="insertTheory('GCD')" data-tooltip="Μέγιστος Κοινός Διαιρέτης (ΜΚΔ). Παράδειγμα: GCD(24;36)">GCD</button>
        <button class="theory" onclick="insertTheory('FACTORS')" data-tooltip="Γινόμενο Πρώτων Παραγόντων. Παράδειγμα: FACTORS(56)">FACTORS</button>
        
        <button class="clear" onclick="clearInput()">C</button>
        <button onclick="writeCmd('(')">(</button>
        <button onclick="writeCmd(')')">)</button>
        <button class="operator" onclick="writeCmd('^')">xʸ</button>
        <button class="operator" onclick="writeCmd('\\div')">÷</button>

        <button onclick="writeCmd('7')">7</button>
        <button onclick="writeCmd('8')">8</button>

<script>
    // --- SMART FOCUS & KEYBOARD HELPER ---
    function focusCalculatorInput() {
        window.focus();
        if (window.mathField) {
            mathField.focus();
            const hiddenArea = document.querySelector('#math-input textarea');
            if (hiddenArea) {
                hiddenArea.focus({ preventScroll: true });
            }
        }
    }

    function smartFocus() {
        // Ελέγχουμε αν είναι πραγματικό smartphone/tablet (αφή) για αποφυγή ανεπιθύμητου OS πληκτρολογίου
        const isTrueMobileTouch = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isTrueMobileTouch) {
            const hiddenArea = document.querySelector('#math-input textarea');
            if (hiddenArea) hiddenArea.blur();
        } else {
            // Σε Desktop και στο Preview iframe, επιτρέπουμε ΠΑΝΤΑ την πληκτρολόγηση από φυσικό πληκτρολόγιο
            focusCalculatorInput();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('calc_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        updateModalThemeButton(savedTheme);

        const savedHistory = localStorage.getItem('calc_history');
        if (savedHistory) {
            try { calcHistory = JSON.parse(savedHistory); } catch (e) { calcHistory = []; }
        }
        setTimeout(smartFocus, 100); 
    });

    // Αυτόματη εστίαση όταν το παράθυρο/iframe λαμβάνει focus
    window.addEventListener('focus', () => {
        const isTrueMobileTouch = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (!isTrueMobileTouch) focusCalculatorInput();
    });

    // --- GLOBAL CLICK HANDLER ---
    document.getElementById('calc-body').addEventListener('click', function(e) {
        if (e.target.tagName === 'BUTTON' || e.target.closest('.settings-toggle')) return;
        
        const isTrueMobileTouch = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        if (!isTrueMobileTouch || e.target.closest('#math-input')) {
            focusCalculatorInput();
        }
    });

    // Άμεση εστίαση στο πεδίο με κλικ/άγγιγμα
    document.getElementById('math-input').addEventListener('click', function() {
        focusCalculatorInput();
    });
    document.getElementById('math-input').addEventListener('mousedown', function() {
        focusCalculatorInput();
    });

    // --- SETTINGS MODAL LOGIC ---
    function openSettings() {
        document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettings(e) {
        if (e && e.target !== e.currentTarget) return;
        document.getElementById('settings-modal').classList.remove('active');
    }

    function toggleThemeInsideModal() {
        const body = document.body;
        const current = body.getAttribute('data-theme');
        const newTheme = current === 'dark' ? 'light' : 'dark';
        body.setAttribute('data-theme', newTheme);
        localStorage.setItem('calc_theme', newTheme);
        updateModalThemeButton(newTheme);
    }

    function updateModalThemeButton(theme) {
        const icon = document.getElementById('theme-icon');
        const text = document.getElementById('theme-text');
        if (theme === 'dark') {
            icon.innerHTML = '☀️';
            text.innerHTML = 'Switch to Light Mode';
        } else {
            icon.innerHTML = '🌙';
            text.innerHTML = 'Switch to Dark Mode';
        }
    }

    let calcHistory = [];
    let historyIndex = -1;
    let currentDraft = "";
    let lastAns = null; 
    let justCalculated = false; 

    math.import({
        allDivisors: function(n) {
            if (n <= 0 || !Number.isInteger(n)) throw new Error("Integer > 0 required");
            let small = [], large = [], end = Math.floor(Math.sqrt(n));
            for (let i = 1; i <= end; i++) {
                if (n % i === 0) {
                    small.push(i);
                    if (i * i !== n) large.push(n / i);
                }
            }
            large.reverse();
            return small.concat(large);
        },
        myFactors: function(n) {
            if (n < 2 || !Number.isInteger(n)) return [n];
            var factors = [];
            var d = 2;
            while (n % 2 === 0) { factors.push(2); n /= 2; }
            d = 3;
            while (d * d <= n) {
                while (n % d === 0) { factors.push(d); n /= d; }
                d += 2;
            }
            if (n > 1) factors.push(n);
            return factors;
        }
    });

    // =========================================================================
    // --- ΠΑΙΔΑΓΩΓΙΚΟΣ ΑΛΓΟΡΙΘΜΟΣ ΔΕΚΑΔΙΚΗΣ ΚΑΘΕΤΗΣ ΔΙΑΙΡΕΣΗΣ (ΣΤ' ΔΗΜΟΤΙΚΟΥ) ---
    // =========================================================================

    function validateAndNormalizeNumber(rawInput, fieldName = 'αριθμός') {
        if (!rawInput || typeof rawInput !== 'string') {
            return { isValid: false, normalized: '', numValue: 0, error: `Παρακαλώ συμπληρώστε το πεδίο (${fieldName}).` };
        }
        const trimmed = rawInput.trim().replace(/\s+/g, '');
        if (!trimmed) {
            return { isValid: false, normalized: '', numValue: 0, error: `Το πεδίο (${fieldName}) δεν μπορεί να είναι κενό.` };
        }
        if (trimmed.startsWith('-')) {
            return { isValid: false, normalized: '', numValue: 0, error: `Το πεδίο (${fieldName}) δεν μπορεί να είναι αρνητικός αριθμός.` };
        }
        const withComma = trimmed.replace(/\./g, ',');
        const commaCount = (withComma.match(/,/g) || []).length;
        if (commaCount > 1) {
            return { isValid: false, normalized: '', numValue: 0, error: `Ο ${fieldName} περιέχει περισσότερες από μία υποδιαστολές (${trimmed}).` };
        }
        if (!/^[0-9]+(,[0-9]+)?$/.test(withComma)) {
            if (/^,[0-9]+$/.test(withComma)) {
                const fixed = `0${withComma}`;
                return { isValid: true, normalized: fixed, numValue: Number(fixed.replace(',', '.')) };
            }
            if (/^[0-9]+,$/.test(withComma)) {
                const fixed = withComma.slice(0, -1);
                return { isValid: true, normalized: fixed, numValue: Number(fixed) };
            }
            if (withComma === ',') {
                return { isValid: false, normalized: '', numValue: 0, error: `Εισαγάγατε μόνο υποδιαστολή χωρίς ψηφία.` };
            }
            return { isValid: false, normalized: '', numValue: 0, error: `Ο ${fieldName} περιέχει μη έγκυρους χαρακτήρες (${trimmed}). Επιτρέπονται μόνο αριθμητικά ψηφία.` };
        }
        const parts = withComma.split(',');
        const intPart = parts[0].replace(/^0+(?=\d)/, '') || '0';
        const normalized = parts.length > 1 ? `${intPart},${parts[1]}` : intPart;
        const numValue = Number(normalized.replace(',', '.'));
        if (isNaN(numValue) || !isFinite(numValue)) {
            return { isValid: false, normalized: '', numValue: 0, error: `Μη έγκυρη αριθμητική τιμή στο πεδίο (${fieldName}).` };
        }
        if (numValue > 999999) {
            return { isValid: false, normalized: '', numValue: 0, error: `Ο ${fieldName} είναι υπερβολικά μεγάλος (έως 999.999).` };
        }
        return { isValid: true, normalized, numValue };
    }

    function getDecimalCount(val) {
        const parts = val.split(',');
        return parts.length > 1 ? parts[1].length : 0;
    }

    function shiftDecimalRight(val, places) {
        if (places <= 0) return val;
        const parts = val.split(',');
        let intPart = parts[0] || '0';
        let decPart = parts[1] || '';

        if (decPart.length <= places) {
            const zerosNeeded = places - decPart.length;
            const combined = intPart + decPart + '0'.repeat(zerosNeeded);
            return combined.replace(/^0+(?=\d)/, '') || '0';
        } else {
            const newIntPart = (intPart + decPart.slice(0, places)).replace(/^0+(?=\d)/, '') || '0';
            const newDecPart = decPart.slice(places);
            return `${newIntPart},${newDecPart}`;
        }
    }

    function isTerminatingDivision(dividendStr, divisorStr) {
        try {
            const divParts = dividendStr.replace(/\./g, ',').split(',');
            const disParts = divisorStr.replace(/\./g, ',').split(',');

            const divDec = divParts[1] ? divParts[1].length : 0;
            const disDec = disParts[1] ? disParts[1].length : 0;
            const maxDec = Math.max(divDec, disDec);

            const divInt = Math.round(Number(dividendStr.replace(',', '.')) * Math.pow(10, maxDec));
            const disInt = Math.round(Number(divisorStr.replace(',', '.')) * Math.pow(10, maxDec));

            if (disInt === 0) return false;
            if (divInt === 0) return true;

            let a = Math.abs(divInt);
            let b = Math.abs(disInt);
            while (b) {
                const t = b;
                b = a % b;
                a = t;
            }
            const gcd = a;
            let reducedDivisor = Math.abs(disInt) / gcd;

            while (reducedDivisor % 2 === 0) reducedDivisor /= 2;
            while (reducedDivisor % 5 === 0) reducedDivisor /= 5;

            return reducedDivisor === 1;
        } catch {
            return false;
        }
    }

    function solveDivision(dividendInput, divisorInput, maxDecimalPlaces = 3) {
        const divValidation = validateAndNormalizeNumber(dividendInput, 'Διαιρετέος');
        if (!divValidation.isValid) throw new Error(divValidation.error || 'Μη έγκυρος Διαιρετέος.');

        const disValidation = validateAndNormalizeNumber(divisorInput, 'Διαιρέτης');
        if (!disValidation.isValid) throw new Error(disValidation.error || 'Μη έγκυρος Διαιρέτης.');

        if (disValidation.numValue === 0) throw new Error('Ο διαιρέτης δεν μπορεί να είναι 0!');

        const cleanDividend = divValidation.normalized;
        const cleanDivisor = disValidation.normalized;

        const divisorDecimals = getDecimalCount(cleanDivisor);
        const wasShifted = divisorDecimals > 0;
        const shiftMultiplier = Math.pow(10, divisorDecimals);

        let effectiveDividendStr = cleanDividend;
        let effectiveDivisorStr = cleanDivisor;
        let shiftExplanation = '';

        if (wasShifted) {
            effectiveDivisorStr = shiftDecimalRight(cleanDivisor, divisorDecimals);
            effectiveDividendStr = shiftDecimalRight(cleanDividend, divisorDecimals);
            shiftExplanation = `Επειδή ο διαιρέτης (${cleanDivisor}) είναι δεκαδικός με ${divisorDecimals} δεκαδικό${divisorDecimals > 1 ? 'α' : ''} ψηφί${divisorDecimals > 1 ? 'α' : 'ο'}, πολλαπλασιάζουμε και τους δύο αριθμούς &times; ${shiftMultiplier}. Έτσι εκτελούμε την ισοδύναμη διαίρεση: ${effectiveDividendStr} : ${effectiveDivisorStr}`;
        }

        const shiftInfo = {
            wasShifted,
            shiftMultiplier,
            originalDividend: cleanDividend,
            originalDivisor: cleanDivisor,
            shiftedDividend: effectiveDividendStr,
            shiftedDivisor: effectiveDivisorStr,
            explanation: shiftExplanation,
        };

        const effectiveDivisor = parseInt(effectiveDivisorStr.replace(',', ''), 10);
        if (isNaN(effectiveDivisor) || effectiveDivisor === 0) throw new Error('Μη έγκυρος ακέραιος διαιρέτης.');

        const baseDividendStr = effectiveDividendStr;

        const isTerminating = isTerminatingDivision(cleanDividend, cleanDivisor);
        const allowedMaxDecimals = isTerminating ? 6 : maxDecimalPlaces;

        if (divValidation.numValue === 0) {
            const singleStep = {
                stepIndex: 0,
                currentChunk: 0,
                chunkDigitsStr: '0',
                quotientDigit: 0,
                isDecimalPointPlacedHere: false,
                product: 0,
                remainder: 0,
                broughtDownDigit: null,
                broughtDownFromIndex: null,
                isBroughtDownZero: false,
                hasSubtraction: true,
                columnEndIndex: 0,
                hints: {
                    quotientPrompt: `Πόσες φορές χωράει το ${effectiveDivisor} στο 0;`,
                    productPrompt: `0 × ${effectiveDivisor} = 0`,
                    remainderPrompt: `0 - 0 = 0`,
                    bringDownPrompt: `Η διαίρεση ολοκληρώθηκε!`,
                    detailedExplanation: `Το ${effectiveDivisor} στο 0 χωράει 0 φορές. 0 × ${effectiveDivisor} = 0, υπόλοιπο 0. Το πηλίκο είναι 0.`,
                },
            };
            return {
                originalDividendStr: cleanDividend,
                originalDivisorStr: cleanDivisor,
                baseDividendStr: cleanDividend,
                effectiveDividendStr: '0',
                effectiveDivisor,
                shiftInfo,
                steps: [singleStep],
                quotientStr: '0',
                finalRemainder: 0,
                isExact: true,
                isTerminating: true
            };
        }

        const dividendParts = effectiveDividendStr.split(',');
        const integerPartStr = dividendParts[0];
        const decimalPartStr = dividendParts[1] || '';

        const steps = [];
        let quotientStr = '';
        let currentChunk = 0;
        let currentChunkCol = -1;
        let decimalPlaced = false;
        let addedZeroCount = 0;
        let displayDividendStr = effectiveDividendStr;
        let digitPointer = 0;

        const intVal = parseInt(integerPartStr, 10);
        const isPureInteger = (decimalPartStr.length === 0);

        let allDigits = [];

        if (isPureInteger && intVal < effectiveDivisor) {
            // Παιδαγωγική διαδικασία Δημοτικού όταν ο ακέραιος διαιρετέος είναι μικρότερος από τον διαιρέτη (π.χ. 3 : 75)
            // «Το 75 δεν χωράει στο 3. Βάζουμε 0 και κόμμα στο πηλίκο (0,) και προσθέτουμε ένα μηδενικό στον διαιρετέο (30).»
            // «Το 75 δεν χωράει στο 30. Βάζουμε 0 στο πηλίκο (0,0) και προσθέτουμε μηδέν στον διαιρετέο (300).»
            quotientStr = '0,';
            decimalPlaced = true;
            currentChunk = intVal;
            let runningDividendStr = integerPartStr;

            let zerosAdded = 0;
            while (currentChunk < effectiveDivisor) {
                let prevChunk = currentChunk;
                currentChunk = currentChunk * 10;
                runningDividendStr += '0';
                zerosAdded++;
                let isFirst = (zerosAdded === 1);
                if (!isFirst) quotientStr += '0';

                steps.push({
                    stepIndex: steps.length,
                    currentChunk: prevChunk,
                    chunkDigitsStr: prevChunk.toString(),
                    quotientDigit: 0,
                    isDecimalPointPlacedHere: isFirst,
                    product: 0,
                    remainder: prevChunk,
                    broughtDownDigit: '0',
                    broughtDownFromIndex: null,
                    isBroughtDownZero: true,
                    columnEndIndex: runningDividendStr.length - 2,
                    isInitialZero: true,
                    hasSubtraction: false,
                    hints: {
                        quotientPrompt: isFirst
                            ? `Το ${effectiveDivisor} δεν χωράει στο ${prevChunk}. Βάζουμε μηδέν και κόμμα στο πηλίκο (${quotientStr}) και προσθέτουμε ένα μηδενικό στον διαιρετέο (${runningDividendStr}).`
                            : `Το ${effectiveDivisor} δεν χωράει στο ${prevChunk}. Βάζουμε μηδέν στο πηλίκο (${quotientStr}) και προσθέτουμε μηδέν στον διαιρετέο (${runningDividendStr}).`,
                        productPrompt: `0 × ${effectiveDivisor} = 0`,
                        remainderPrompt: `${prevChunk} - 0 = ${prevChunk}`,
                        bringDownPrompt: `Προσθέτουμε 0 στον διαιρετέο &rarr; ${currentChunk}`,
                        detailedExplanation: isFirst
                            ? `Το ${effectiveDivisor} δεν χωράει στο ${prevChunk}. Γράφουμε 0, στο πηλίκο και προσθέτουμε ένα μηδενικό στο τέλος του διαιρετέου.`
                            : `Το ${effectiveDivisor} δεν χωράει στο ${prevChunk}. Γράφουμε 0 στο πηλίκο και προσθέτουμε άλλο ένα μηδενικό στο τέλος του διαιρετέου.`
                    }
                });
            }
            displayDividendStr = runningDividendStr;
            currentChunkCol = displayDividendStr.length - 1;
            digitPointer = 0;
        } else {
            for (let i = 0; i < integerPartStr.length; i++) {
                allDigits.push({ digit: integerPartStr[i], originalIndex: i, col: i, isDecimal: false });
            }
            for (let i = 0; i < decimalPartStr.length; i++) {
                allDigits.push({ digit: decimalPartStr[i], originalIndex: integerPartStr.length + 1 + i, col: integerPartStr.length + i, isDecimal: true });
            }

            if (intVal < effectiveDivisor) {
                currentChunk = intVal;
                currentChunkCol = integerPartStr.length - 1;
                decimalPlaced = true;
                quotientStr = '0,';

                steps.push({
                    stepIndex: 0,
                    currentChunk,
                    chunkDigitsStr: currentChunk.toString(),
                    quotientDigit: 0,
                    isDecimalPointPlacedHere: true,
                    product: 0,
                    remainder: currentChunk,
                    broughtDownDigit: null,
                    broughtDownFromIndex: null,
                    isBroughtDownZero: false,
                    columnEndIndex: currentChunkCol,
                    isInitialZero: true,
                    hasSubtraction: false,
                    hints: {
                        quotientPrompt: `Το ακέραιο μέρος (${currentChunk}) είναι μικρότερο από το ${effectiveDivisor}. Βάζουμε 0, στο πηλίκο!`,
                        productPrompt: `0 × ${effectiveDivisor} = 0`,
                        remainderPrompt: `${currentChunk} - 0 = ${currentChunk}`,
                        bringDownPrompt: `Παίρνουμε το επόμενο δεκαδικό ψηφίο!`,
                        detailedExplanation: `Επειδή το ακέραιο μέρος (${currentChunk}) είναι μικρότερο από το ${effectiveDivisor}, γράφουμε 0, στο πηλίκο και συνεχίζουμε.`
                    }
                });

                let entry = allDigits[integerPartStr.length];
                currentChunk = currentChunk * 10 + parseInt(entry.digit, 10);
                currentChunkCol = entry.col;
                digitPointer = integerPartStr.length + 1;
            } else {
                digitPointer = 0;
                let initialChunkStr = '';
                while (digitPointer < allDigits.length) {
                    const entry = allDigits[digitPointer++];
                    initialChunkStr += entry.digit;
                    currentChunkCol = entry.col;
                    if (parseInt(initialChunkStr, 10) >= effectiveDivisor) break;
                }
                currentChunk = parseInt(initialChunkStr, 10);
            }
        }

        let finished = false;
        let safetyCounter = 0;

        while (!finished && safetyCounter < 100) {
            safetyCounter++;
            const quotientDigit = Math.floor(currentChunk / effectiveDivisor);
            const product = quotientDigit * effectiveDivisor;
            const remainder = currentChunk - product;

            let isDecimalPlacedHere = false;
            if (!decimalPlaced) {
                if (digitPointer >= integerPartStr.length) {
                    decimalPlaced = true;
                    isDecimalPlacedHere = true;
                    quotientStr += quotientDigit.toString() + ',';
                } else {
                    quotientStr += quotientDigit.toString();
                }
            } else {
                quotientStr += quotientDigit.toString();
            }

            let broughtDownDigit = null;
            let broughtDownFromIndex = null;
            let broughtDownCol = null;
            let isBroughtDownZero = false;

            if (digitPointer < allDigits.length) {
                const entry = allDigits[digitPointer++];
                broughtDownDigit = entry.digit;
                broughtDownFromIndex = entry.originalIndex;
                broughtDownCol = entry.col;
            } else {
                const currentDecimals = quotientStr.includes(',') ? (quotientStr.split(',')[1] || '').length : 0;
                if (remainder === 0) {
                    finished = true;
                } else if (currentDecimals < allowedMaxDecimals) {
                    if (!decimalPlaced) {
                        decimalPlaced = true;
                        isDecimalPlacedHere = true;
                        if (!quotientStr.includes(',')) quotientStr += ',';
                    }
                    broughtDownDigit = '0';
                    const hasAnySubSoFar = (quotientDigit > 0) || steps.some(s => s.hasSubtraction);
                    if (!hasAnySubSoFar) {
                        displayDividendStr += '0';
                        const ghostDigitCount = displayDividendStr.replace(/[,.]/g, '').length;
                        broughtDownCol = ghostDigitCount - 1;
                    } else {
                        const ghostDigitCount = displayDividendStr.replace(/[,.]/g, '').length;
                        broughtDownCol = ghostDigitCount + addedZeroCount++;
                    }
                    isBroughtDownZero = true;
                } else {
                    finished = true;
                }
            }

            const nextChunk = broughtDownDigit !== null ? remainder * 10 + parseInt(broughtDownDigit, 10) : null;
            const hasAnySubSoFarForHint = (quotientDigit > 0) || steps.some(s => s.hasSubtraction);

            steps.push({
                stepIndex: steps.length,
                currentChunk,
                chunkDigitsStr: currentChunk.toString(),
                quotientDigit,
                isDecimalPointPlacedHere: isDecimalPlacedHere,
                product,
                remainder,
                broughtDownDigit,
                broughtDownFromIndex,
                isBroughtDownZero,
                nextChunk,
                columnEndIndex: currentChunkCol,
                isInitialZero: false,
                hasSubtraction: quotientDigit > 0,
                hints: {
                    quotientPrompt: quotientDigit === 0
                        ? `Το ${effectiveDivisor} στο ${currentChunk} δεν χωράει (0 φορές). Βάζουμε 0 στο πηλίκο!`
                        : `Πόσες φορές χωράει το ${effectiveDivisor} στο ${currentChunk}; (${quotientDigit} φορές)`,
                    productPrompt: `Πολλαπλασιάζουμε: ${quotientDigit} × ${effectiveDivisor} = ${product}`,
                    remainderPrompt: `Αφαιρούμε: ${currentChunk} - ${product} = ${remainder}`,
                    bringDownPrompt: broughtDownDigit !== null 
                        ? (isBroughtDownZero 
                            ? (!hasAnySubSoFarForHint
                                ? `Προσθέτουμε ένα μηδενικό στον διαιρετέο (${displayDividendStr}) &rarr; ${nextChunk}`
                                : `Το υπόλοιπο είναι ${remainder}. Προσθέτουμε 0 για να συνεχιστεί η διαίρεση με δεκαδικά.`)
                            : `Κατεβάζουμε το ψηφίο ${broughtDownDigit} δίπλα στο υπόλοιπο ${remainder}. Νέος αριθμός: ${nextChunk}`)
                        : `Η διαίρεση ολοκληρώθηκε!`,
                    detailedExplanation: quotientDigit === 0
                        ? (!hasAnySubSoFarForHint && isBroughtDownZero
                            ? `Επειδή το ${effectiveDivisor} δεν χωράει στο ${currentChunk}, γράφουμε 0 στο πηλίκο και προσθέτουμε ένα μηδενικό στο τέλος του διαιρετέου.`
                            : `Επειδή το ${effectiveDivisor} δεν χωράει στο ${currentChunk}, γράφουμε 0 στο πηλίκο.`)
                        : `Το ${effectiveDivisor} χωράει ${quotientDigit} φορές στο ${currentChunk} (${quotientDigit} × ${effectiveDivisor} = ${product}). Αφαιρούμε και βρίσκουμε υπόλοιπο ${remainder}.`
                }
            });

            if (finished || nextChunk === null) break;
            currentChunk = nextChunk;
            currentChunkCol = broughtDownCol;
        }

        if (quotientStr.endsWith(',')) quotientStr = quotientStr.slice(0, -1);

        const finalStep = steps[steps.length - 1];
        const finalRemainder = finalStep ? finalStep.remainder : 0;
        const isExact = finalRemainder === 0;

        return {
            originalDividendStr: cleanDividend,
            originalDivisorStr: cleanDivisor,
            baseDividendStr,
            effectiveDividendStr: displayDividendStr,
            effectiveDivisor,
            shiftInfo,
            steps,
            quotientStr,
            finalRemainder,
            isExact,
            isTerminating
        };
    }

    // --- ΟΠΤΙΚΗ ΑΝΑΠΑΡΑΣΤΑΣΗ ΔΕΚΑΔΙΚΗΣ ΚΑΘΕΤΗΣ ΔΙΑΙΡΕΣΗΣ ---

        // 3. Στήλες και Βήματα Κάθετης Διάταξης (Grid με Ghost-Comma όπως στο V-MUL)
        // Ανάλυση ψηφίων του διαιρετέου και εντοπισμός υποδιαστολής (ghost-comma)
        let divDigits = [];
        for (let i = 0; i < effectiveDividendStr.length; i++) {

            if (char === '.' || char === ',') {

        // Υπολογισμός μέγιστου αριθμού στηλών
        let maxCol = divDigits.length - 1;
        for (let i = 0; i < steps.length; i++) {
            const step = steps[i];
            if (step.hasSubtraction) {
                let colEnd = step.columnEndIndex !== undefined ? step.columnEndIndex : step.chunkDigitsStr.length - 1;
                if (colEnd > maxCol) maxCol = colEnd;
            }
        }
        const totalCols = maxCol + 1;

        function buildRowHTML(cellsMap) {
            let html = '<div class="ld-grid-row">';
            for (let c = 0; c < totalCols; c++) {
                if (cellsMap[c]) {
                    const cell = cellsMap[c];

                    html += `<div class="ld-cell${cls}">${cell.content}</div>`;

            }
            html += '</div>';
            return html;

        let rowsHTML = [];

        // 1η Γραμμή: Διαιρετέος με ghost-comma (η υποδιαστολή δεν καταλαμβάνει πλάτος στήλης)
        let topRowCells = {};
        for (let c = 0; c < divDigits.length; c++) {

            topRowCells[c] = { content: `${d.val}${ghost}`, className: '' };
        }
        rowsHTML.push(buildRowHTML(topRowCells));

        // Βήματα αφαίρεσης
        let isFirstSubtraction = true;
        let prevSubStep = null;
        for (let i = 0; i < steps.length; i++) {
            const step = steps[i];
            if (!step.hasSubtraction) continue;

            const prodStr = step.product.toString();
            let colEnd = step.columnEndIndex !== undefined ? step.columnEndIndex : step.chunkDigitsStr.length - 1;

            // Εμφάνιση του τρέχοντος chunk αν δεν είναι το πρώτο βήμα
            if (!isFirstSubtraction) {
                // Υπολογισμός εμφάνισης chunk: διατηρούμε το υπόλοιπο της προηγούμενης αφαίρεσης (π.χ. '0' + '5' = '05')
                let chunkStr = step.currentChunk.toString();

        // 4. Παιδαγωγικά Βήματα (Accordion Drawer)
        let pedStepsCards = steps.map((s, idx) => `
            <div class="ped-step-card">
                <div class="ped-step-badge">Βήμα ${idx + 1}</div>

        visualHTML += `

    // --- ΕΥΚΛΕΙΔΕΙΑ ΔΙΑΙΡΕΣΗ (E-DIV ΑΚΕΡΑΙΩΝ) ---
    function generateLongDivision(dividend, divisor) {
        if (!Number.isInteger(dividend) || !Number.isInteger(divisor)) return { error: "Integers Only" };
        if (divisor === 0) return { error: "Div by 0" };
        if (dividend < 0 || divisor < 0) return { error: "Positive only" };
        
        let dividendStr = dividend.toString();
        let digits = dividendStr.split('').map(Number);
        let steps = [];
        let quotientStr = "";
        let currentVal = 0;
        let hasStartedPrinting = false;
        
        steps.push(`<div class="ld-row">${dividendStr}</div>`);
        
        for (let i = 0; i < digits.length; i++) {
            let previousRem = currentVal; 
            currentVal = currentVal * 10 + digits[i];
            
            if (hasStartedPrinting) {
                let valStr = (previousRem === 0) ? ("0" + digits[i]) : currentVal.toString();
                let indent = (i + 1) - valStr.length;
                let spaces = " ".repeat(indent);
                steps.push(`<div class="ld-row">${spaces}${valStr}</div>`);
            }
            
            if (currentVal < divisor) {
                if (quotientStr.length > 0) quotientStr += "0";
                continue;
            }
            
            let q = Math.floor(currentVal / divisor);
            let prod = q * divisor;
            let rem = currentVal - prod;
            quotientStr += q;
            hasStartedPrinting = true;

            let prodStr = prod.toString();
            let indent = (i + 1) - prodStr.length;
            let spaces = " ".repeat(indent);
            
            steps.push(`<div class="ld-row">${spaces}<span class="ld-minus">-</span><span class="ld-subtrahend">${prodStr}</span></div>`);
            currentVal = rem;
        }
        
        if (hasStartedPrinting) {
            let remStr = currentVal.toString();
            let remIndent = digits.length - remStr.length;
            steps.push(`<div class="ld-row">${" ".repeat(remIndent)}${remStr}</div>`);
        }

        if (quotientStr === "") quotientStr = "0";

        return { steps: steps, quotient: quotientStr, remainder: currentVal };
    }

    // --- HELPER: FORMAT STANDARD (1.234,56) ---
    function formatStandard(numStr) {
        let parts = numStr.toString().split('.');
        let integerPart = parts[0];
        let decimalPart = parts[1] || "";
        integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return integerPart + (decimalPart ? "," + decimalPart : "");
    }

    // --- GRID V-MUL GENERATOR ---
    function generateGridMultiplication(a, b) {
        if (a < 0 || b < 0) return { error: "Positive only" };

        let strA = a.toString();
        let strB = b.toString();
        
        let decimalsA = (strA.split('.')[1] || []).length;
        let decimalsB = (strB.split('.')[1] || []).length;
        let totalDecimals = decimalsA + decimalsB;

        let intA = parseInt(strA.replace('.', ''));
        let intB = parseInt(strB.replace('.', ''));

        let displayA = formatStandard(strA);
        let displayB = formatStandard(strB);

        let digitsB = intB.toString().split('').map(Number).reverse();
        let finalIntResult = (BigInt(intA) * BigInt(intB)).toString();
        let cols = Math.max(displayA.replace(/[.,]/g,'').length, displayB.replace(/[.,]/g,'').length, finalIntResult.length) + 2; 

        function createRowCells(formattedStr, totalCols, isResult = false, prefix = null) {
            let cells = [];
            let cleanDigits = [];
            for (let i=0; i<formattedStr.length; i++) {
                let char = formattedStr[i];
                if (char === '.' || char === ',') {
                    if (cleanDigits.length > 0) cleanDigits[cleanDigits.length-1].mark = char;
                } else {
                    cleanDigits.push({ val: char, mark: null });
                }
            }

            for(let k=0; k<totalCols; k++) {
                let digitIndex = k - (totalCols - cleanDigits.length);
                let cellContent = "";
                let cellClass = isResult ? "grid-cell result-cell" : "grid-cell";
                if (!isResult && prefix && k === (totalCols - cleanDigits.length - 1)) {
                    cellContent = `<span class="grid-operator">${prefix}</span>`;
                } else if (digitIndex >= 0) {
                    let d = cleanDigits[digitIndex];
                    let ghost = "";
                    if (d.mark === ',') ghost = '<span class="ghost-comma">,</span>';
                    if (d.mark === '.') ghost = '<span class="ghost-dot">.</span>';
                    cellContent = `${d.val}${ghost}`;
                } else if (prefix && k===0 && (totalCols - cleanDigits.length - 1) < 0) {
                     cellContent = `<span class="grid-operator">${prefix}</span>`;
                }

                cells.push(`<div class="${cellClass}">${cellContent}</div>`);
            }
            return cells.join("");
        }

        let gridHtml = `<div class="vmul-grid" style="grid-template-columns: repeat(${cols}, auto);">`;
        gridHtml += createRowCells(displayA, cols);
        gridHtml += createRowCells(displayB, cols, false, "×");
        gridHtml += `<div class="grid-border"></div>`;

        for (let i = 0; i < digitsB.length; i++) {
            let digit = digitsB[i];
            let product = intA * digit;
            let pDisplay = product.toString(); 
            
            let cells = [];
            let cleanDigits = [];
            for (let char of pDisplay) {
                if (char === '.') { if (cleanDigits.length>0) cleanDigits[cleanDigits.length-1].mark = '.'; }
                else cleanDigits.push({val: char, mark: null});
            }
            
            let effectiveLen = cleanDigits.length;
            let endPos = cols - 1 - i; 
            let startPos = endPos - effectiveLen + 1;
            let prefix = (digitsB.length > 1 && i === digitsB.length - 1) ? "+" : "";
            
            if (digitsB.length > 1) {
                for(let k=0; k<cols; k++) {
                    let cellContent = "";
                    let cellClass = "grid-cell partial-cell";
                    
                    if (k >= startPos && k <= endPos) {
                        let d = cleanDigits[k - startPos];
                        let ghost = (d.mark === '.') ? '<span class="ghost-dot">.</span>' : '';
                        cellContent = `${d.val}${ghost}`;
                    }
                    if (prefix && k === startPos - 1) {
                        cellContent = `<span class="grid-operator">${prefix}</span>`;
                    }
                    cells.push(`<div class="${cellClass}">${cellContent}</div>`);
                }
                gridHtml += cells.join("");
            }
        }

        if (digitsB.length > 1) {
            gridHtml += `<div class="grid-border"></div>`;
        }

        while (finalIntResult.length <= totalDecimals) {
            finalIntResult = "0" + finalIntResult;
        }
        
        let rawResultStr = "";
        if (totalDecimals > 0) {
            let splitIdx = finalIntResult.length - totalDecimals;
            rawResultStr = finalIntResult.slice(0, splitIdx) + "." + finalIntResult.slice(splitIdx);
        } else {
            rawResultStr = finalIntResult;
        }
        
        let finalDisplay = formatStandard(rawResultStr);
        gridHtml += createRowCells(finalDisplay, cols, true);
        gridHtml += `</div>`;
        return { visual: gridHtml };
    }
