<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle border highlight -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.4" />

  <!-- LCD Screen Display -->
  <rect x="74" y="74" width="364" height="106" rx="22" fill="url(#screenGrad)" stroke="#334155" stroke-width="3" />
  
  <!-- Screen Text / Elements -->
  <text x="96" y="112" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#38bdf8" letter-spacing="1.5">CALCULATOR K6</text>
  <text x="416" y="152" font-family="'Courier New', Courier, monospace" font-weight="800" font-size="38" fill="#4ade80" text-anchor="end">9.6 ÷ 0.08</text>

  <!-- Keypad Grid (3 columns x 3 rows) -->
  <!-- Row 1 -->
  <!-- Key 1: π -->
  <rect x="74" y="206" width="102" height="74" rx="18" fill="#334155" filter="url(#btnShadow)" />
  <text x="125" y="254" font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700" font-size="34" fill="#f8fafc" text-anchor="middle">π</text>

  <!-- Key 2: √x -->
  <rect x="205" y="206" width="102" height="74" rx="18" fill="#334155" filter="url(#btnShadow)" />
  <text x="256" y="253" font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700" font-size="32" fill="#f8fafc" text-anchor="middle">√x</text>

  <!-- Key 3: ÷ (Accent / Orange) -->
  <rect x="336" y="206" width="102" height="74" rx="18" fill="url(#orangeGrad)" filter="url(#btnShadow)" />
  <text x="387" y="255" font-family="system-ui, sans-serif" font-weight="800" font-size="36" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <!-- Key 4: Σ -->
  <rect x="74" y="298" width="102" height="74" rx="18" fill="#334155" filter="url(#btnShadow)" />
  <text x="125" y="347" font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700" font-size="34" fill="#f8fafc" text-anchor="middle">Σ</text>

  <!-- Key 5: x² -->
  <rect x="205" y="298" width="102" height="74" rx="18" fill="#334155" filter="url(#btnShadow)" />
  <text x="256" y="347" font-family="'Cambria Math', 'Times New Roman', serif" font-weight="700" font-size="30" fill="#f8fafc" text-anchor="middle">x²</text>

  <!-- Key 6: × (Accent / Blue) -->
  <rect x="336" y="298" width="102" height="74" rx="18" fill="url(#accentGrad)" filter="url(#btnShadow)" />
  <text x="387" y="347" font-family="system-ui, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <!-- Key 7: f(x) -->
  <rect x="74" y="390" width="102" height="74" rx="18" fill="#1e293b" filter="url(#btnShadow)" />
  <text x="125" y="437" font-family="'Cambria Math', 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="28" fill="#94a3b8" text-anchor="middle">f(x)</text>

  <!-- Key 8: D-DIV badge / 120 -->
  <rect x="205" y="390" width="102" height="74" rx="18" fill="#1e293b" filter="url(#btnShadow)" />
  <text x="256" y="438" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#38bdf8" text-anchor="middle">= 120</text>

  <!-- Key 9: = (Big Blue) -->
  <rect x="336" y="390" width="102" height="74" rx="18" fill="url(#accentGrad)" filter="url(#btnShadow)" />
  <text x="387" y="439" font-family="system-ui, sans-serif" font-weight="800" font-size="38" fill="#ffffff" text-anchor="middle">=</text>
</svg>